name: Update data.xlsx (자동 다운로드)

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요한 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: data.xlsx 자동 다운로드 및 업데이트
        env:
          MYHUBON_EMAIL: ${{ secrets.MYHUBON_EMAIL }}
          MYHUBON_PASSWORD: ${{ secrets.MYHUBON_PASSWORD }}
        run: python scripts/update_data.py
