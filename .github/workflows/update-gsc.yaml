name: Update Google Search Console Data

on:
  schedule:
    - cron: '10 10 * * *'   # 매일 UTC 10:10 = KST 19:10 (GSC 2일 지연 감안)
  workflow_dispatch:         # 수동 실행 가능

jobs:
  fetch-gsc:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # Git 히스토리를 전부 가져와 충돌 가능성을 줄입니다.

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install google-api-python-client google-auth requests

      - name: GSC 데이터 수집
        env:
          GSC_CLIENT_ID:     ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
        run: python scripts/fetch_gsc.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name  "GSC Auto Updater"
          git config user.email "bot@github.com"
          git add gsc-data.json
          
          if git diff --staged --quiet; then
            echo "변경 없음 — 스킵"
          else
            git commit -m "chore: GSC 자동 업데이트 ($(date +'%Y-%m-%d'))"
            # 일반 git push 대신 --force를 사용하여 원격과의 꼬임을 강제로 해결합니다.
            git push --force origin main
          fi
