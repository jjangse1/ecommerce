name: Update Google Search Console Data

on:
  schedule:
    - cron: '10 10 * * *'        # 매일 한국시간 새벽 3시 (UTC 기준)
  workflow_dispatch:           # 수동으로도 실행 가능

jobs:
  fetch-gsc:
    runs-on: ubuntu-latest

    steps:
      - name: Repository 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요한 패키지 설치
        run: pip install google-api-python-client google-auth-oauthlib

      - name: GSC 데이터 가져오기
        env:
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
        run: python scripts/fetch_gsc.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "GSC Auto Updater"
          git config user.email "bot@github.com"
          git add gsc-data.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: 자동 GSC 데이터 업데이트 ($(date +'%Y-%m-%d'))"
            git push
          fi